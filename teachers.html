<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="data/logo.png">
    <title>Преподаватели — Stud&School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:#FAF8FC;color:#1F2937;min-height:100vh;overflow-x:hidden}
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(140px);opacity:0.04}
        body::before{width:620px;height:620px;background:#8B5CF6;top:-180px;right:-180px;animation:driftA 28s ease-in-out infinite}
        body::after{width:460px;height:460px;background:#E11D8D;bottom:-130px;left:-130px;animation:driftB 32s ease-in-out infinite}
        @keyframes driftA{0%,100%{transform:translate(0,0)}33%{transform:translate(-40px,30px)}66%{transform:translate(20px,-15px)}}
        @keyframes driftB{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-25px)}66%{transform:translate(-15px,30px)}}
        .header{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid rgba(139,92,246,0.08);position:sticky;top:0;z-index:100;background:rgba(250,248,252,0.75);backdrop-filter:blur(24px)}
        .logo{font-size:1.3rem;font-weight:800;color:#8B5CF6;display:flex;align-items:center;gap:10px;text-decoration:none;letter-spacing:-0.5px}
        .logo img{width:38px;height:38px;object-fit:contain}
        .btn-back{padding:9px 18px;border-radius:50px;border:1px solid rgba(139,92,246,0.2);background:transparent;color:#8B5CF6;font-weight:600;font-size:0.82rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all 0.28s;font-family:inherit}
        .btn-back:hover{background:rgba(139,92,246,0.05)}
        .main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:56px 32px 80px}
        .hero{text-align:center;margin-bottom:64px}
        .hero-badge{display:inline-block;padding:8px 20px;border-radius:50px;background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.12);font-size:0.72rem;font-weight:700;color:#8B5CF6;text-transform:uppercase;letter-spacing:2px;font-family:'JetBrains Mono',monospace;margin-bottom:16px}
        .hero h1{font-family:'Unbounded',sans-serif;font-size:clamp(2.2rem,4vw,3.2rem);font-weight:900;letter-spacing:-2px;line-height:1.1;margin-bottom:12px}
        .hero h1 span{background:linear-gradient(135deg,#8B5CF6,#E11D8D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{font-size:0.95rem;color:#6B7280;max-width:500px;margin:0 auto 24px;line-height:1.5}
        .hero-stats{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
        .hero-stat{text-align:center}
        .hero-stat-num{font-family:'Unbounded',sans-serif;font-size:1.6rem;font-weight:800;color:#8B5CF6}
        .hero-stat-lbl{font-size:0.72rem;color:#9CA3AF;font-weight:500}
        .teachers-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
        .teacher-card{position:relative;background:rgba(255,255,255,0.6);backdrop-filter:blur(16px);border-radius:24px;padding:32px 28px;border:1px solid rgba(139,92,246,0.06);transition:all 0.4s cubic-bezier(0.25,0.8,0.25,1.2);overflow:hidden;display:flex;gap:22px;align-items:flex-start}
        .teacher-card:hover{transform:translateY(-6px);border-color:rgba(139,92,246,0.18);box-shadow:0 20px 48px rgba(139,92,246,0.09)}
        .teacher-card::after{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#8B5CF6,#E11D8D);border-radius:4px 0 0 4px;opacity:0;transition:opacity 0.3s}
        .teacher-card:hover::after{opacity:1}
        .teacher-avatar-wrap{flex-shrink:0;position:relative}
        .teacher-avatar{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;color:#fff;overflow:hidden;position:relative;z-index:1}
        .teacher-avatar img{width:100%;height:100%;object-fit:cover}
        .teacher-avatar-glow{position:absolute;inset:-3px;border-radius:23px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);z-index:0;opacity:0;transition:opacity 0.3s;filter:blur(8px)}
        .teacher-card:hover .teacher-avatar-glow{opacity:0.3}
        .teacher-info{flex:1;min-width:0}
        .teacher-name{font-family:'Unbounded',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
        .teacher-uni{display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:600;color:#8B5CF6;background:rgba(139,92,246,0.05);padding:5px 12px;border-radius:50px;margin-bottom:8px}
        .teacher-subjects{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
        .subject-tag{padding:3px 10px;border-radius:50px;font-size:0.7rem;font-weight:600;background:rgba(225,29,141,0.05);color:#E11D8D;border:1px solid rgba(225,29,141,0.1)}
        .teacher-quote{font-size:0.82rem;color:#6B7280;line-height:1.5;margin-bottom:14px;font-style:italic;position:relative;padding-left:16px;border-left:2px solid rgba(139,92,246,0.15)}
        .teacher-actions{display:flex;gap:10px;align-items:center}
        .btn-apply{padding:10px 20px;border-radius:50px;border:none;background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;font-weight:700;font-size:0.8rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.25s;box-shadow:0 4px 14px rgba(139,92,246,0.15)}
        .btn-apply:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(139,92,246,0.28)}
        .btn-detail{padding:10px 20px;border-radius:50px;border:1.5px solid rgba(139,92,246,0.2);background:transparent;color:#8B5CF6;font-weight:600;font-size:0.8rem;cursor:pointer;font-family:inherit;transition:all 0.25s}
        .btn-detail:hover{background:rgba(139,92,246,0.04);border-color:rgba(139,92,246,0.35)}
        .teacher-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(139,92,246,0.06);font-size:0.82rem;color:#6B7280;line-height:1.6}
        .teacher-detail.open{display:block}
        .teacher-detail-row{display:flex;gap:12px;margin-bottom:6px}
        .teacher-detail-row span{display:flex;align-items:center;gap:5px;font-size:0.78rem;color:#9CA3AF}
        .teacher-detail-row span i{color:#8B5CF6;font-size:0.7rem}
        .empty-state{text-align:center;padding:80px 20px;color:#B0B7C3;grid-column:1/-1}
        .empty-state i{display:block;font-size:2.5rem;margin-bottom:12px;opacity:0.2}
        @media(max-width:768px){
            .header{padding:10px 20px}
            .main{padding:32px 18px 56px}
            .teachers-grid{grid-template-columns:1fr;gap:20px}
            .teacher-card{flex-direction:column;align-items:center;text-align:center;padding:24px 18px}
            .teacher-quote{padding-left:0;border-left:none;text-align:center}
            .teacher-subjects{justify-content:center}
            .teacher-actions{justify-content:center}
            .teacher-detail-row{justify-content:center}
        }
        .footer{border-top:1px solid rgba(139,92,246,0.08);padding:24px 32px;text-align:center;font-size:0.75rem;color:#9CA3AF;position:relative;z-index:1}
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="data/logo.png" alt="Stud&School">Stud&School</a>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> На главную</a>
    </header>

    <main class="main">
        <div class="hero">
            <div class="hero-badge">Команда</div>
            <h1>Учат те, кто <span>сам сдал</span> на 90+</h1>
            <p>Студенты и выпускники МГТУ им. Баумана, Beijing Institute of Technology и других топовых вузов. Знают систему изнутри.</p>
            <div class="hero-stats">
                <div class="hero-stat"><div class="hero-stat-num" id="statTeachers">0</div><div class="hero-stat-lbl">преподавателей</div></div>
                <div class="hero-stat"><div class="hero-stat-num">МГТУ</div><div class="hero-stat-lbl">основной вуз</div></div>
                <div class="hero-stat"><div class="hero-stat-num">90+</div><div class="hero-stat-lbl">средний балл ЕГЭ</div></div>
            </div>
        </div>

        <div class="teachers-grid" id="teachersGrid">
            <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i>Загружаем...</div>
        </div>
    </main>

    <footer class="footer">© 2026 Stud&School. Все права защищены.</footer>

    <script>
        async function loadTeachers() {
            try {
                var r = await fetch('http://localhost:5001/api/teachers');
                var teachers = await r.json();
                renderTeachers(teachers);
            } catch(e) {
                document.getElementById('teachersGrid').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i>Ошибка загрузки</div>';
            }
        }

        function renderTeachers(teachers) {
            var grid = document.getElementById('teachersGrid');
            if (!teachers.length) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-chalkboard-teacher"></i>Преподаватели скоро появятся</div>';
                return;
            }

            document.getElementById('statTeachers').textContent = teachers.length;

            grid.innerHTML = teachers.map(function(t, i) {
                var fullName = (t.last_name + ' ' + t.first_name).trim();
                var initials = (t.first_name ? t.first_name[0] : '') + (t.last_name ? t.last_name[0] : '');
                var avatarHtml = t.photo_url 
                    ? '<img src="' + t.photo_url + '" alt="' + fullName + '">' 
                    : initials || '?';
                var subjects = t.subjects ? t.subjects.split(',').map(function(s){ return s.trim() }) : [];
                var subjectTags = subjects.map(function(s){ return '<span class="subject-tag">' + s + '</span>' }).join('');
                var quotes = [
                    'Объясняю сложное простым языком. Без занудства.',
                    'Сам прошёл через ЕГЭ — знаю каждый подводный камень.',
                    'Готовлю к высоким баллам без стресса и выгорания.',
                    'Физика и математика — это красиво. Покажу как.'
                ];
                var quote = t.description || quotes[i % quotes.length];

                return '<div class="teacher-card">' +
                    '<div class="teacher-avatar-wrap">' +
                        '<div class="teacher-avatar-glow"></div>' +
                        '<div class="teacher-avatar">' + avatarHtml + '</div>' +
                    '</div>' +
                    '<div class="teacher-info">' +
                        '<div class="teacher-name">' + fullName + '</div>' +
                        (t.university ? '<div class="teacher-uni"><i class="fas fa-university"></i> ' + t.university + '</div>' : '') +
                        (subjectTags ? '<div class="teacher-subjects">' + subjectTags + '</div>' : '') +
                        '<div class="teacher-quote">' + quote + '</div>' +
                        '<div class="teacher-actions">' +
                            '<a href="courses.html" class="btn-apply"><i class="fas fa-rocket"></i> Записаться</a>' +
                            (t.description || t.experience ? '<button class="btn-detail" onclick="toggleDetail(this)">Подробнее <i class="fas fa-chevron-down"></i></button>' : '') +
                        '</div>' +
                        '<div class="teacher-detail">' +
                            (t.description ? '<p style="margin-bottom:8px">' + t.description + '</p>' : '') +
                            '<div class="teacher-detail-row">' +
                                (t.experience ? '<span><i class="fas fa-clock"></i> ' + t.experience + '</span>' : '') +
                                (t.university ? '<span><i class="fas fa-graduation-cap"></i> ' + t.university + '</span>' : '') +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleDetail(btn) {
            var detail = btn.parentElement.nextElementSibling;
            var isOpen = detail.classList.contains('open');
            if (isOpen) {
                detail.classList.remove('open');
                btn.innerHTML = 'Подробнее <i class="fas fa-chevron-down"></i>';
            } else {
                detail.classList.add('open');
                btn.innerHTML = 'Скрыть <i class="fas fa-chevron-up"></i>';
            }
        }

        loadTeachers();
    </script>
</body>
</html>
