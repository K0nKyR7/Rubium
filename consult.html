<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="data/logo.png">
    <title>Консультант | Stud&School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:#FAF8FC;color:#1F2937;height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(140px);opacity:0.04}
        body::before{width:620px;height:620px;background:#8B5CF6;top:-180px;right:-180px;animation:driftA 28s ease-in-out infinite}
        body::after{width:460px;height:460px;background:#E11D8D;bottom:-130px;left:-130px;animation:driftB 32s ease-in-out infinite}
        @keyframes driftA{0%,100%{transform:translate(0,0)}33%{transform:translate(-40px,30px)}66%{transform:translate(20px,-15px)}}
        @keyframes driftB{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-25px)}66%{transform:translate(-15px,30px)}}

        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid rgba(139,92,246,0.06);flex-shrink:0;z-index:10;background:rgba(250,248,252,0.78);backdrop-filter:blur(24px)}
        .header-left{display:flex;align-items:center;gap:10px}
        .btn-back{width:36px;height:36px;border-radius:50%;border:1px solid rgba(139,92,246,0.15);background:transparent;color:#8B5CF6;cursor:pointer;transition:all 0.25s ease;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:0.82rem;flex-shrink:0}
        .btn-back:hover{background:rgba(139,92,246,0.05);border-color:rgba(139,92,246,0.3)}
        .rubi-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.9rem;position:relative}
        .rubi-avatar::after{content:'';position:absolute;inset:-2px;border-radius:12px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);z-index:-1;opacity:0;transition:opacity 0.3s;filter:blur(4px)}
        .header:hover .rubi-avatar::after{opacity:0.2}
        .rubi-name{font-weight:700;font-size:0.92rem;color:#1F2937;letter-spacing:-0.3px}
        .rubi-status{font-size:0.68rem;color:#22C55E;display:flex;align-items:center;gap:4px}
        .rubi-status::before{content:'';width:5px;height:5px;border-radius:50%;background:#22C55E}

        .chat{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;max-width:800px;width:100%;margin:0 auto;overflow:hidden}
        .chat-messages{flex:1;overflow-y:auto;padding:20px 22px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
        .chat-messages::-webkit-scrollbar{width:3px}
        .chat-messages::-webkit-scrollbar-track{background:transparent}
        .chat-messages::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.1);border-radius:3px}

        .message{display:flex;gap:10px;animation:msgIn 0.45s cubic-bezier(0.25,0.8,0.25,1.2) forwards;opacity:0;transform:translateY(16px)}
        @keyframes msgIn{to{opacity:1;transform:translateY(0)}}
        .message.bot .avatar{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;flex-shrink:0}
        .message.user{flex-direction:row-reverse}
        .message.user .avatar{width:32px;height:32px;border-radius:10px;background:rgba(139,92,246,0.1);display:flex;align-items:center;justify-content:center;color:#8B5CF6;font-size:0.75rem;flex-shrink:0;font-weight:700}
        .message .bubble{padding:11px 15px;border-radius:16px;font-size:0.85rem;line-height:1.55;max-width:75%;position:relative}
        .message.bot .bubble{background:#fff;color:#4B5563;border:1px solid rgba(139,92,246,0.06);border-top-left-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,0.02)}
        .message.user .bubble{background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;border-top-right-radius:4px}

        .typing-indicator{display:flex;gap:3px;padding:8px 15px;align-items:center}
        .typing-indicator span{width:6px;height:6px;border-radius:50%;background:#B0B7C3;animation:bounce 1.2s infinite}
        .typing-indicator span:nth-child(2){animation-delay:0.15s}
        .typing-indicator span:nth-child(3){animation-delay:0.3s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.3}30%{transform:translateY(-8px);opacity:1}}

        .chat-input-area{padding:10px 18px 16px;flex-shrink:0;z-index:1}
        .chat-input-row{display:flex;gap:8px;background:#fff;border-radius:50px;padding:5px 5px 5px 18px;border:1px solid rgba(139,92,246,0.08);box-shadow:0 4px 16px rgba(0,0,0,0.03);transition:all 0.3s ease}
        .chat-input-row:focus-within{border-color:rgba(139,92,246,0.25);box-shadow:0 4px 20px rgba(139,92,246,0.06)}
        .chat-input{flex:1;border:none;background:transparent;font-family:inherit;font-size:0.88rem;color:#1F2937;outline:none;padding:9px 0;letter-spacing:-0.2px}
        .chat-input::placeholder{color:#B0B7C3}
        .btn-send{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;font-size:0.9rem;cursor:pointer;transition:all 0.25s ease;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .btn-send:hover{transform:scale(1.04);box-shadow:0 4px 14px rgba(139,92,246,0.25)}
        .btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none}
        .input-hint{text-align:center;font-size:0.66rem;color:#B0B7C3;margin-top:6px}

        .login-overlay{position:absolute;inset:0;background:rgba(250,248,252,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:18px;text-align:center;padding:28px 22px}
        .login-overlay .lock-icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#8B5CF6,#E11D8D);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;box-shadow:0 8px 28px rgba(139,92,246,0.2)}
        .login-overlay h3{font-family:'Unbounded',sans-serif;font-size:1.1rem;font-weight:700;color:#1F2937;letter-spacing:-0.5px}
        .login-overlay p{font-size:0.85rem;color:#6B7280;max-width:280px;line-height:1.5}
        .btn-login-redirect{padding:13px 28px;border-radius:50px;border:none;background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;font-weight:700;font-size:0.88rem;cursor:pointer;font-family:inherit;letter-spacing:-0.3px;box-shadow:0 6px 20px rgba(139,92,246,0.2);transition:all 0.28s ease;display:inline-flex;align-items:center;gap:7px}
        .btn-login-redirect:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(139,92,246,0.3)}

        @media(max-width:600px){
            .header{padding:10px 14px}
            .chat-messages{padding:14px 14px 6px}
            .chat-input-area{padding:6px 10px 12px}
            .message .bubble{font-size:0.8rem;max-width:88%}
            .btn-back{width:32px;height:32px;font-size:0.75rem}
            .rubi-avatar{width:32px;height:32px;font-size:0.8rem}
            .login-overlay .lock-icon{width:52px;height:52px;font-size:1.3rem}
            .login-overlay h3{font-size:1rem}
            .login-overlay p{font-size:0.8rem}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i></a>
            <div class="rubi-avatar"><i class="fas fa-robot"></i></div>
            <div>
                <div class="rubi-name">Консультант</div>
                <div class="rubi-status">онлайн</div>
            </div>
        </div>
    </header>

    <div class="chat">
        <div class="chat-messages" id="chatMessages"></div>

        <div class="login-overlay" id="loginOverlay">
            <div class="lock-icon"><i class="fas fa-lock"></i></div>
            <h3>Доступ к Консультанту</h3>
            <p>Войди в аккаунт чтобы общаться с Консультантом и подбирать курсы персонально под тебя</p>
            <button class="btn-login-redirect" onclick="window.location.href='login.html'">
                <i class="fas fa-sign-in-alt"></i> Войти в аккаунт
            </button>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-row">
                <input type="text" class="chat-input" id="chatInput" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}">
                <button class="btn-send" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="input-hint">Не делись личными данными без необходимости(паспортные данные, данные о банковских картах и т.д.)</div>
        </div>
    </div>

    <script>
        var chatMessages=document.getElementById('chatMessages'),chatInput=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn'),loginOverlay=document.getElementById('loginOverlay'),isProcessing=false,currentUser=null,sessionToken=null;

        function addMessage(text,type){
            var msg=document.createElement('div');msg.className='message '+type;
            if(type==='bot')msg.innerHTML='<div class="avatar"><i class="fas fa-robot"></i></div><div class="bubble">'+text.replace(/\n/g,'<br>')+'</div>';
            else{var initial=currentUser?(currentUser.user_metadata?.first_name||currentUser.email||'?').charAt(0).toUpperCase():'?';msg.innerHTML='<div class="avatar">'+initial+'</div><div class="bubble">'+text.replace(/\n/g,'<br>')+'</div>'}
            chatMessages.appendChild(msg);scrollToBottom()
        }

        function scrollToBottom(){requestAnimationFrame(function(){chatMessages.scrollTop=chatMessages.scrollHeight})}

        function addTypingIndicator(){
            var indicator=document.createElement('div');indicator.className='message bot';indicator.id='typingIndicator';
            indicator.innerHTML='<div class="avatar"><i class="fas fa-robot"></i></div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            chatMessages.appendChild(indicator);scrollToBottom()
        }

        function removeTypingIndicator(){var indicator=document.getElementById('typingIndicator');if(indicator)indicator.remove()}

        async function initAuth(){
            var {data:{session}}=await supabase.auth.getSession();
            if(session&&session.user){currentUser=session.user;sessionToken=session.access_token;loginOverlay.style.display='none';chatInput.disabled=false;sendBtn.disabled=false;
                try{var response=await fetch('http://localhost:5001/api/consult',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionToken},body:JSON.stringify({query:'',session_id:currentUser.id})});if(response.ok){var data=await response.json();addMessage(data.response,'bot')}}catch(e){addMessage('Расскажи, какой предмет тебя интересует и к какому экзамену готовишься.','bot')}
            }else{currentUser=null;sessionToken=null;loginOverlay.style.display='flex';chatInput.disabled=true;sendBtn.disabled=true;addMessage('Привет! Я Консультант 👋\nВойди в аккаунт чтобы я помог тебе подобрать курс.','bot')}
        }

        async function sendMessage(){
            if(isProcessing||!sessionToken)return;
            var text=chatInput.value.trim();if(!text)return;
            isProcessing=true;addMessage(text,'user');chatInput.value='';sendBtn.disabled=true;addTypingIndicator();
            try{
                var response=await fetch('http://localhost:5001/api/consult',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionToken},body:JSON.stringify({query:text,session_id:currentUser?currentUser.id:'default'})});
                removeTypingIndicator();
                if(response.status===401){initAuth();return}
                if(!response.ok)throw new Error('Server error');
                var data=await response.json();addMessage(data.response,'bot')
            }catch(err){removeTypingIndicator();addMessage('Ой, что-то пошло не так. Попробуй ещё раз.','bot')}
            isProcessing=false;sendBtn.disabled=false;chatInput.focus()
        }

        chatInput.focus();initAuth();
    </script>
</body>
</html>
